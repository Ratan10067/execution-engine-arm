# ==============================================================================
# Judge0 ARM64 & x86_64 High-Performance Execution Engine Configuration
# Optimized for 10 GB RAM Oracle Cloud Ampere A1 & Multi-Core Deployments
# ==============================================================================

# Server & Network
PORT=2358
HOST=0.0.0.0
VERSION=1.13.0
MAINTAINER=Judge0 ARM64 Engine
HOMEPAGE=https://judge0.com

# Memory Limits (in KB) - Pre-tuned for 10 GB RAM
# Default submission limit: 512 MB (524288 KB)
MEMORY_LIMIT=524288
# Max allowed submission limit: 10 GB (10485760 KB)
MAX_MEMORY_LIMIT=10485760

# CPU Time Limits (in seconds)
CPU_TIME_LIMIT=2.0
MAX_CPU_TIME_LIMIT=15.0
CPU_EXTRA_TIME=0.5
MAX_CPU_EXTRA_TIME=2.0

# Wall Time Limits (in seconds)
WALL_TIME_LIMIT=5.0
MAX_WALL_TIME_LIMIT=20.0

# Stack Limits (in KB)
STACK_LIMIT=64000
MAX_STACK_LIMIT=256000

# Concurrency & Worker Threads
# Number of parallel execution workers (Tuned for 4-16 Core ARM64 processors)
COUNT=8
MAX_QUEUE_SIZE=1000

# Subprocess & Thread Limits
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120

# Output File Size Limit (in KB)
MAX_FILE_SIZE=10240
MAX_MAX_FILE_SIZE=51200

# Submission Cache & TTL (in seconds)
SUBMISSION_CACHE_DURATION=3600

# Webhooks & Callbacks
ENABLE_CALLBACKS=true
CALLBACK_TIMEOUT=5.0

# Authentication (Optional - leave empty for open API)
# AUTHN_TOKEN=
# AUTHN_HEADER=X-Auth-Token
# AUTHZ_TOKEN=
# AUTHZ_HEADER=X-Auth-User

# Sandbox Base Directory
SANDBOX_BASE_DIR=/tmp/judge0_sandbox
